<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel Log">
  <title>Fuel Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="img/car.png" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="shell">
    <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></div>

    <main class="home-scroll" id="homeScroll">
      <div class="page-inner" id="homeInner">
        <div id="banner" class="banner" hidden></div>

        <!-- หน้าหลัก: ดูทีเดียวรู้ภาพรวม -->
        <section class="view" id="view-home">
          <header class="brand">
            <div class="brand-text"><small id="carBrand">Toyota</small><h1 class="car-title">Yaris ATIV</h1></div>
            <button class="menu-btn" id="settingsBtn" type="button" data-i18n-aria="settings"><svg viewBox="0 0 24 24"><path d="M5 9h14M9 15h10"/></svg></button>
          </header>
          <div class="specs">
            <button class="spec pastel" id="odoBtn" type="button">
              <span data-i18n="spec.odo"></span><b><em id="odoValue">–</em><small data-i18n="unit.km"></small></b>
              <small id="odoNote" hidden></small>
            </button>
            <div class="spec"><span data-i18n="spec.lastFill"></span><b id="specLast">–</b></div>
            <div class="spec"><span data-i18n="spec.fuel"></span><b id="specType">–</b></div>
          </div>

          <div class="car-stage" id="carStage" aria-hidden="true">
            <span class="car" id="car">
              <img class="car-img" src="img/car.png" alt="" width="1400" height="702" draggable="false">
              <span class="lamp head-l" aria-hidden="true"></span>
              <span class="lamp head-r" aria-hidden="true"></span>
            </span>
          </div>

          <div class="hero" id="hero">
            <div class="hero-track" id="heroTrack"></div>
            <div class="hero-dots" id="heroDots"><i></i><i></i><i></i></div>
          </div>

          <div class="home-tiles">
            <div class="tile"><span data-i18n="tile.avg"></span><b id="tileAvg">–</b></div>
            <button class="tile solid" id="qPrice" type="button"><span id="tilePriceLabel"></span><b id="tilePrice">–</b></button>
          </div>

          <div id="alerts" class="alerts"></div>
        </section>

        <!-- ประวัติ -->
        <section class="view" id="view-history" hidden>
          <header class="view-head"><h1 data-i18n="nav.history"></h1><small id="historySub"></small></header>
          <div class="segmented glide subtabs" data-sub="history" role="tablist">
            <button type="button" class="active" data-pane="fuel" data-i18n="sub.fuel"></button>
            <button type="button" data-pane="expenses" data-i18n="sub.expenses"></button>
          </div>
          <div class="pane" data-pane="fuel">
            <section class="hs-card" id="historySummary"></section>
            <div class="segmented glide year-tabs" id="historyYears" role="tablist"></div>
            <ul id="history" class="cycle-list"></ul>
            <div id="loadMore" class="load-more" hidden><span class="spinner"></span></div>
          </div>
          <div class="pane" data-pane="expenses" hidden>
            <div id="expBody"></div>
          </div>
        </section>

        <!-- สถิติ: อัตราสิ้นเปลือง · ค่าน้ำมันรายเดือน · สรุปรายปี -->
        <section class="view" id="view-stats" hidden>
          <header class="view-head"><h1 data-i18n="nav.stats"></h1><small id="statsSub"></small></header>
          <div class="segmented glide subtabs" data-sub="stats" role="tablist">
            <button type="button" class="active" data-pane="rate" data-i18n="sub.rate"></button>
            <button type="button" data-pane="monthly" data-i18n="sub.monthly"></button>
            <button type="button" data-pane="yearly" data-i18n="sub.yearly"></button>
          </div>
          <div class="pane" data-pane="rate">
      <section class="stats">
        <div class="stat"><span class="stat-label" data-i18n="stat.avg"></span><span class="stat-value" id="statAvg">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="stat.last"></span><span class="stat-value" id="statLast">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="stat.costKm"></span><span class="stat-value" id="statCostKm">–</span><span class="stat-unit" data-i18n="unit.bahtKm"></span></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2 data-i18n="chart.rate"></h2>
          <div class="segmented glide" id="rangeSeg" role="tablist">
            <button data-range="30" data-i18n="range.month"></button>
            <button data-range="365" data-i18n="range.year"></button>
            <button data-range="all" data-i18n="range.all"></button>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div id="legend" class="legend"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 data-i18n="cmp.title"></h2></div>
        <div id="typeCompare" class="compare"></div>
        <p class="hint" data-i18n="cmp.note"></p>
      </section>
          </div>
          <div class="pane" data-pane="monthly" hidden>
      <section class="stats">
        <div class="stat"><span class="stat-label" data-i18n="m.max"></span><span class="stat-value" id="mMax">–</span><span class="stat-unit" id="mMaxLabel"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="m.now"></span><span class="stat-value" id="mNow">–</span><span class="stat-unit" id="mNowLabel"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="m.avg"></span><span class="stat-value" id="mAvg">–</span><span class="stat-unit" data-i18n="unit.perMonth"></span></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2 data-i18n="m.chart"></h2>
          <div class="segmented glide" id="mRangeSeg" role="tablist">
            <button data-range="6" data-i18n="range.6m"></button>
            <button data-range="12" data-i18n="range.year"></button>
            <button data-range="all" data-i18n="range.all"></button>
          </div>
        </div>
        <div id="mChart" class="chart"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 data-i18n="m.list"></h2></div>
        <ul id="mList" class="history"></ul>
      </section>
          </div>
          <div class="pane" data-pane="yearly" hidden>
            <div class="segmented glide wide year-seg" id="yearSeg"></div>
            <div id="yearBody"></div>
          </div>
        </section>

        <!-- รถ: ดูแลรถ + ผ่อนรถ -->
        <section class="view" id="view-car" hidden>
          <header class="view-head"><h1 data-i18n="nav.car"></h1><small id="carSub"></small></header>
          <div class="segmented glide subtabs" data-sub="car" role="tablist">
            <button type="button" class="active" data-pane="care" data-i18n="sub.care"></button>
            <button type="button" data-pane="loan" data-i18n="sub.loan"></button>
          </div>
          <div class="pane" data-pane="care"><div id="careBody"></div></div>
          <div class="pane" data-pane="loan" hidden><div id="loanBody"></div></div>
        </section>
      </div>
    </main>

    <!-- แถบเมนูลอย + ปุ่มเพิ่ม -->
    <div class="dock">
      <nav class="tabs" id="tabs">
        <i class="tab-glider" id="tabGlider" aria-hidden="true"></i>
        <button type="button" data-tab="home" class="active" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav.home"></span></button>
        <button type="button" data-tab="history"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span data-i18n="nav.history"></span></button>
        <button type="button" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg><span data-i18n="nav.stats"></span></button>
        <button type="button" data-tab="car"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L4 16.7 7.3 20l5.3-5.3a4 4 0 0 0 5.1-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/></svg><span data-i18n="nav.car"></span></button>
      </nav>
      <button type="button" class="plus-btn" id="plusBtn" data-i18n-aria="q.add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <!-- ฟอร์มค่าใช้จ่ายอื่น -->
  <section id="expenseForm" class="sheet sheet-rise fill-sheet" hidden>
    <header class="fill-top">
      <div class="grabber" aria-hidden="true"></div>
      <div class="fill-head">
        <div class="kind-seg glide" role="tablist"><button type="button" data-switch="form" data-i18n="q.add"></button><button type="button" class="active" data-i18n="exp.title"></button></div>
        <button class="close-x" type="button" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </header>
    <form id="expForm" class="fill-form" novalidate>
      <label class="amount">
        <span class="amount-label" data-i18n="exp.amount"></span>
        <span class="amount-input"><span class="currency">฿</span><input type="text" name="amount" inputmode="decimal" autocomplete="off" placeholder="0" required></span>
      </label>
      <div class="type-pills cat-pills" id="catChips" role="radiogroup"></div>
      <div class="fill-cards">
        <label class="fill-card">
          <span class="fc-label" data-i18n="exp.mileage"></span>
          <input type="text" name="mileage" inputmode="numeric" autocomplete="off">
          <small class="hint" id="expMileageHint"></small>
        </label>
        <label class="fill-card">
          <span class="fc-label" data-i18n="form.date"></span>
          <input type="date" name="date" required>
        </label>
      </div>
      <label class="fill-card">
        <span class="fc-label" data-i18n="exp.note"></span>
        <input type="text" name="note" autocomplete="off" class="note-input">
      </label>
      <button type="submit" class="save-btn" id="expSaveBtn" disabled data-i18n="save"></button>
    </form>
  </section>

  <!-- ตั้งค่าการแจ้งเตือน -->
  <section id="careSettings" class="sheet sheet-rise" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h1 data-i18n="rem.edit"></h1>
      <span class="spacer"></span>
    </header>
    <form id="remForm" class="form" novalidate>
      <div class="field-row">
        <label class="field"><span data-i18n="rem.interval"></span><input type="text" name="serviceInterval" inputmode="numeric" autocomplete="off"></label>
        <label class="field"><span data-i18n="rem.months"></span><input type="text" name="serviceMonths" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="field-row">
        <label class="field"><span data-i18n="rem.lastService"></span><input type="text" name="lastServiceKm" inputmode="numeric" autocomplete="off"></label>
        <label class="field"><span data-i18n="rem.lastServiceDate"></span><input type="date" name="lastServiceDate"></label>
      </div>
      <small class="hint" data-i18n="rem.lastServiceHint"></small>
      <label class="field"><span data-i18n="rem.tank"></span><input type="text" name="tankL" inputmode="decimal" autocomplete="off"></label>
      <label class="field"><span data-i18n="rem.tax"></span><input type="date" name="taxDue"></label>
      <label class="field"><span data-i18n="rem.insurance"></span><input type="date" name="insuranceDue"></label>
      <label class="field"><span data-i18n="rem.act"></span><input type="date" name="actDue"></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- อัปเดตเลขไมล์ด่วน -->
  <section id="odoSheet" class="sheet sheet-bottom" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <h2 data-i18n="odo.title"></h2>
    <form id="odoForm" class="form" novalidate>
      <label class="field">
        <span data-i18n="odo.label"></span>
        <input type="text" id="odoInput" inputmode="numeric" autocomplete="off">
        <small class="hint" id="odoHint"></small>
      </label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="odoSave" disabled data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- ราคาน้ำมัน PTT วันนี้ -->
  <div class="backdrop" id="backdrop" hidden></div>
  <section id="prices" class="sheet sheet-bottom" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <h2 data-i18n="prices.title"></h2>
    <p class="hint" id="pricesDate"></p>
    <div id="pricesList" class="detail"></div>
    <div class="form-actions"><button type="button" class="btn ghost" data-close data-i18n="close"></button></div>
  </section>

  <!-- ฟอร์มเพิ่ม log -->
  <section id="form" class="sheet sheet-rise fill-sheet" hidden>
    <header class="fill-top">
      <div class="grabber" aria-hidden="true"></div>
      <div class="fill-head">
        <div class="kind-seg glide" role="tablist"><button type="button" class="active" data-i18n="q.add"></button><button type="button" data-switch="expenseForm" data-i18n="exp.title"></button></div>
        <button class="close-x" type="button" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </header>
    <form id="entryForm" class="fill-form" novalidate>
      <label class="amount">
        <span class="amount-label" data-i18n="form.price"></span>
        <span class="amount-input"><span class="currency">฿</span><input type="text" name="price" inputmode="decimal" autocomplete="off" placeholder="0" required></span>
      </label>
      <div class="type-pills" id="typeChips" role="radiogroup"></div>

      <div class="fill-cards">
        <label class="fill-card">
          <span class="fc-label" data-i18n="form.mileage"></span>
          <input type="text" name="mileage" inputmode="numeric" autocomplete="off" required>
          <small id="mileageHint" class="hint"></small>
        </label>
        <label class="fill-card">
          <span class="fc-label" data-i18n="form.oilPrice"></span>
          <input type="text" name="oilPrice" inputmode="decimal" autocomplete="off" required>
          <small id="priceHint" class="hint"></small>
        </label>
      </div>

      <label class="date-pill">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 9v10h14V9z"/></svg>
        <input type="date" name="date" required>
      </label>

      <div class="live" id="preview"></div>

      <button type="submit" class="save-btn" id="saveBtn" disabled data-i18n="save"></button>
    </form>
  </section>

  <!-- รายการเติมน้ำมันของรอบเดือน -->
  <section id="monthSheet" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="monthTitle"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body">
      <p class="month-range" id="monthRange"></p>
      <section class="hs-card month-sum" id="monthSum"></section>
      <ul id="monthList" class="fill-list"></ul>
    </div>
  </section>

  <!-- รายละเอียด / ลบ -->
  <section id="detail" class="sheet sheet-bottom" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <h2 data-i18n="detail.title"></h2>
    <div id="detailBody" class="detail"></div>
    <p class="hint" data-i18n="detail.hint"></p>
    <div class="form-actions">
      <button type="button" class="btn danger" id="deleteBtn" data-i18n="detail.delete"></button>
    </div>
  </section>

  <!-- ตั้งค่า -->
  <section id="settings" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="settings"></h1>
      <span class="spacer"></span>
    </header>
    <div class="set-page">
      <section class="set-profile">
        <img src="img/car.png" alt="" class="set-car">
        <label class="set-name">
          <input type="text" id="carNameInput" maxlength="30" autocomplete="off" placeholder="Yaris ATIV" data-i18n-aria="s.carName">
          <small><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15.2 3.6a2 2 0 0 1 2.8 0l2.4 2.4a2 2 0 0 1 0 2.8L9 20.2l-5.6 1.2a.8.8 0 0 1-1-1L3.6 15z"/></svg><span data-i18n="s.carNameHint"></span></small>
        </label>
      </section>

      <h3 class="set-title" data-i18n="s.look"></h3>
      <section class="set-group">
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#5e5ce6"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></span><b data-i18n="s.mode"></b></div>
          <div class="segmented glide wide" id="themeSeg">
            <button type="button" data-theme-mode="auto" data-i18n="s.mode.auto"></button>
            <button type="button" data-theme-mode="light" data-i18n="s.mode.light"></button>
            <button type="button" data-theme-mode="dark" data-i18n="s.mode.dark"></button>
          </div>
        </div>
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#ff375f"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 10.8C22 5.9 17.5 2 12 2zM6.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM9.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM14.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM17.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></span><b data-i18n="s.accent"></b></div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#0a84ff"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg></span><b data-i18n="s.language"></b></div>
          <div class="segmented glide wide" id="langSeg">
            <button type="button" data-lang="th">ไทย</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </section>

      <h3 class="set-title" data-i18n="s.sheet"></h3>
      <section class="set-group">
        <div class="set-row" id="connCard">
          <span class="set-ic" style="--c:#30d158"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM5 8v4h6V8zM13 8v4h6V8zM5 14v5h6v-5zM13 14v5h6v-5z"/></svg></span>
          <div class="set-text">
            <b id="connTitle"></b>
            <small id="connUrl"></small>
          </div>
          <span class="conn-dot"></span>
        </div>
        <div class="set-actions" id="connActions">
          <button type="button" class="set-btn" id="editLinkBtn" data-i18n="s.editLink"></button>
          <button type="button" class="set-btn danger" id="clearSetupBtn" data-i18n="s.disconnect"></button>
        </div>
        <div class="set-row stack" id="setupEditor">
          <label class="field">
            <span data-i18n="s.setupCode"></span>
            <textarea id="setupInput" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            <small class="hint" data-i18n="s.setupHint"></small>
          </label>
          <p id="settingsStatus" class="hint"></p>
          <div class="form-actions">
            <button type="button" class="btn ghost" id="cancelEditBtn" data-i18n="cancel"></button>
            <button type="button" class="btn primary" id="saveSetupBtn" data-i18n="s.connect"></button>
          </div>
        </div>
      </section>

      <p class="set-foot">Fuel Logger · <span id="appVersion"></span></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
