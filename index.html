<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fuel Log">
  <title>Fuel Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="img/car.png" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="shell">
    <header class="appbar">
      <div class="appbar-title">
        <h1 id="pageTitle">Fuel Logger</h1>
        <div class="dots" id="dots" role="tablist">
          <button data-tab="0" data-i18n-aria="page.fuel"></button>
          <button data-tab="1" data-i18n-aria="page.monthly"></button>
          <button data-tab="2" data-i18n-aria="page.loan"></button>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></div>

    <div class="viewport" id="viewport">
      <div class="track" id="track">
        <!-- หน้า 1: เติมน้ำมัน -->
        <main class="page" id="pageFuel" data-title="app.title">
          <div class="page-inner">
            <div id="banner" class="banner" hidden></div>

            <section class="stats">
              <div class="stat"><span class="stat-label" data-i18n="stat.avg"></span><span class="stat-value" id="statAvg">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
              <div class="stat"><span class="stat-label" data-i18n="stat.last"></span><span class="stat-value" id="statLast">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
              <div class="stat"><span class="stat-label" data-i18n="stat.month"></span><span class="stat-value" id="statMonth">–</span><span class="stat-unit" data-i18n="unit.baht"></span></div>
            </section>

            <button class="car-stage" id="carStage" type="button" data-i18n-aria="car.tap">
              <span class="car-glow" aria-hidden="true"></span>
              <span class="car" id="car">
                <span class="car-shadow" aria-hidden="true"></span>
                <span class="beam" aria-hidden="true"></span>
                <img class="car-img" src="img/car.png" alt="" width="1100" height="526" draggable="false">
                <span class="wheel wheel-front" aria-hidden="true"><img src="img/wheel-front.png" alt="" draggable="false"></span>
                <span class="wheel wheel-rear" aria-hidden="true"><img src="img/wheel-rear.png" alt="" draggable="false"></span>
                <span class="lamp head-l" aria-hidden="true"></span>
                <span class="lamp head-r" aria-hidden="true"></span>
                <span class="lamp tail" aria-hidden="true"></span>
              </span>
              <span class="car-cta">
                <svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M4 11h11M15 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
                <span data-i18n="car.tap"></span>
              </span>
              <span class="car-odo" id="carOdo"></span>
            </button>

            <section class="card">
              <div class="card-head">
                <h2 data-i18n="chart.rate"></h2>
                <div class="segmented" id="rangeSeg" role="tablist">
                  <button data-range="30" data-i18n="range.month"></button>
                  <button data-range="365" data-i18n="range.year"></button>
                  <button data-range="all" data-i18n="range.all"></button>
                </div>
              </div>
              <div id="chart" class="chart"></div>
              <div id="legend" class="legend"></div>
            </section>

            <section class="card">
              <div class="card-head"><h2 data-i18n="history"></h2></div>
              <ul id="history" class="history"></ul>
              <div id="loadMore" class="load-more" hidden><span class="spinner"></span></div>
            </section>
          </div>
        </main>

        <!-- หน้า 2: สรุปรายเดือน -->
        <main class="page" id="pageMonthly" data-title="page.monthly">
          <div class="page-inner">
            <section class="stats">
              <div class="stat"><span class="stat-label" data-i18n="m.max"></span><span class="stat-value" id="mMax">–</span><span class="stat-unit" id="mMaxLabel"></span></div>
              <div class="stat"><span class="stat-label" data-i18n="m.now"></span><span class="stat-value" id="mNow">–</span><span class="stat-unit" id="mNowLabel"></span></div>
              <div class="stat"><span class="stat-label" data-i18n="m.avg"></span><span class="stat-value" id="mAvg">–</span><span class="stat-unit" data-i18n="unit.perMonth"></span></div>
            </section>

            <section class="card">
              <div class="card-head">
                <h2 data-i18n="m.chart"></h2>
                <div class="segmented" id="mRangeSeg" role="tablist">
                  <button data-range="12" data-i18n="range.12m"></button>
                  <button data-range="year" data-i18n="range.thisYear"></button>
                  <button data-range="all" data-i18n="range.all"></button>
                </div>
              </div>
              <div id="mChart" class="chart"></div>
            </section>

            <section class="card">
              <div class="card-head"><h2 data-i18n="m.list"></h2></div>
              <ul id="mList" class="history"></ul>
            </section>
          </div>
        </main>

        <!-- หน้า 3: ผ่อนรถ -->
        <main class="page" id="pageLoan" data-title="page.loan">
          <div class="page-inner" id="loanBody"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- ฟอร์มเพิ่ม log -->
  <section id="form" class="sheet sheet-rise" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="cancel">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h1 data-i18n="form.title"></h1>
      <span class="spacer"></span>
    </header>
    <form id="entryForm" class="form" novalidate>
      <label class="field">
        <span data-i18n="form.date"></span>
        <input type="date" name="date" required>
      </label>
      <div class="field">
        <span data-i18n="form.type"></span>
        <div class="chips" id="typeChips"></div>
      </div>
      <label class="field">
        <span data-i18n="form.mileage"></span>
        <input type="text" name="mileage" inputmode="numeric" autocomplete="off" required>
        <small id="mileageHint" class="hint"></small>
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="form.oilPrice"></span>
          <input type="text" name="oilPrice" inputmode="decimal" autocomplete="off" required>
        </label>
        <label class="field">
          <span data-i18n="form.price"></span>
          <input type="text" name="price" inputmode="decimal" autocomplete="off" required>
        </label>
      </div>
      <small id="priceHint" class="hint"></small>
      <div class="preview" id="preview"></div>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="saveBtn" disabled data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- รายละเอียด / ลบ -->
  <section id="detail" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 data-i18n="detail.title"></h1>
      <span class="spacer"></span>
    </header>
    <div class="form">
      <div id="detailBody" class="detail"></div>
      <p class="hint" data-i18n="detail.hint"></p>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteBtn" data-i18n="detail.delete"></button>
      </div>
    </div>
  </section>

  <!-- ตั้งค่า -->
  <section id="settings" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 data-i18n="settings"></h1>
      <span class="spacer"></span>
    </header>
    <div class="form">
      <h3 class="section-title" data-i18n="s.look"></h3>
      <div class="field">
        <span data-i18n="s.mode"></span>
        <div class="segmented wide" id="themeSeg">
          <button type="button" data-theme-mode="auto" data-i18n="s.mode.auto"></button>
          <button type="button" data-theme-mode="light" data-i18n="s.mode.light"></button>
          <button type="button" data-theme-mode="dark" data-i18n="s.mode.dark"></button>
        </div>
      </div>
      <div class="field">
        <span data-i18n="s.accent"></span>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="wheel-picker" id="huePicker" hidden>
        <div class="hue-ring" id="hueRing">
          <div class="hue-knob" id="hueKnob"></div>
          <div class="hue-preview" id="huePreview"></div>
        </div>
        <p class="hint" data-i18n="s.hue"></p>
        <label class="field slider-field">
          <span data-i18n="s.saturation"></span>
          <input type="range" id="satRange" min="25" max="100" step="1">
        </label>
      </div>
      <div class="field">
        <span data-i18n="s.language"></span>
        <div class="segmented wide" id="langSeg">
          <button type="button" data-lang="th">ไทย</button>
          <button type="button" data-lang="en">English</button>
        </div>
      </div>

      <hr class="divider">
      <h3 class="section-title" data-i18n="s.sheet"></h3>
      <div class="conn-card" id="connCard">
        <div class="conn-status">
          <span class="conn-dot"></span>
          <div>
            <div class="conn-title" id="connTitle"></div>
            <div class="conn-url" id="connUrl"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="editLinkBtn" data-i18n="s.editLink"></button>
          <button type="button" class="btn danger" id="clearSetupBtn" data-i18n="s.disconnect"></button>
        </div>
      </div>
      <div id="setupEditor">
        <label class="field">
          <span data-i18n="s.setupCode"></span>
          <textarea id="setupInput" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          <small class="hint" data-i18n="s.setupHint"></small>
        </label>
        <p id="settingsStatus" class="hint"></p>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="cancelEditBtn" data-i18n="cancel"></button>
          <button type="button" class="btn primary" id="saveSetupBtn" data-i18n="s.connect"></button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
