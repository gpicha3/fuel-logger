<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel Log">
  <title>Fuel Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="img/car.png" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <div class="shell">
    <header class="home-bar">
      <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.90 12.00 L22.15 12.96 L21.75 15.00 L19.30 15.02 L18.57 16.39 L17.59 17.59 L18.50 19.86 L16.77 21.01 L15.02 19.30 L13.54 19.75 L12.00 19.90 L11.04 22.15 L9.00 21.75 L8.98 19.30 L7.61 18.57 L6.41 17.59 L4.14 18.50 L2.99 16.77 L4.70 15.02 L4.25 13.54 L4.10 12.00 L1.85 11.04 L2.25 9.00 L4.70 8.98 L5.43 7.61 L6.41 6.41 L5.50 4.14 L7.23 2.99 L8.98 4.70 L10.46 4.25 L12.00 4.10 L12.96 1.85 L15.00 2.25 L15.02 4.70 L16.39 5.43 L17.59 6.41 L19.86 5.50 L21.01 7.23 L19.30 8.98 L19.75 10.46Z M15.2 12 a3.2 3.2 0 1 0 -6.4 0 a3.2 3.2 0 1 0 6.4 0z"/></svg></button>
      <h1 class="car-title">Yaris ATIV</h1>
      <span class="spacer"></span>
    </header>

    <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg></div>

    <main class="home-scroll" id="homeScroll">
      <div class="page-inner" id="homeInner">
        <button class="hero" id="hero" type="button">
          <div class="hero-value">
            <span class="hero-icon"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3.5A1.5 1.5 0 0 1 5.5 2h8A1.5 1.5 0 0 1 15 3.5V20h.5a1 1 0 1 1 0 2h-12a1 1 0 1 1 0-2H4zM6.5 4.5v5h6v-5zM16.3 5.3a1 1 0 0 1 1.4 0l2.7 2.7c.4.4.6.9.6 1.4V17a2.5 2.5 0 0 1-5 0v-3.5h1.5V17a1 1 0 0 0 2 0v-5.5h-.6A1.6 1.6 0 0 1 17.3 10V8.4l-1-1a1 1 0 0 1 0-1.4z"/></svg></span>
            <span class="hero-num" id="heroNum">–</span>
            <span class="hero-unit" id="heroUnit"></span>
          </div>
          <div class="hero-status" id="heroStatus"></div>
          <div class="hero-dots" id="heroDots"><i></i><i></i><i></i></div>
        </button>
        <button class="odo-chip" id="odoBtn" type="button">
          <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 4a10 10 0 0 0-8.7 15.1 1 1 0 0 0 .9.4h15.6a1 1 0 0 0 .9-.4A10 10 0 0 0 12 4zM12 17.2a1.8 1.8 0 0 1-.9-3.4l5.2-5.3.8.8-4.6 5.9a1.8 1.8 0 0 1-.5 2z"/></svg>
          <span><b id="odoValue">–</b><small id="odoNote"></small></span>
          <svg class="ic pen" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15.2 3.6a2 2 0 0 1 2.8 0l2.4 2.4a2 2 0 0 1 0 2.8L9 20.2l-5.6 1.2a.8.8 0 0 1-1-1L3.6 15z"/></svg>
        </button>

        <button class="car-stage" id="carStage" type="button" data-i18n-aria="car.tap">
          <span class="spotlight" aria-hidden="true"></span>
          <span class="car" id="car">
            <span class="car-shadow" aria-hidden="true"></span>
            <span class="beam" aria-hidden="true"></span>
            <img class="car-img" src="img/car.png" alt="" width="768" height="369" draggable="false">
            <span class="lamp head-l" aria-hidden="true"></span>
            <span class="lamp head-r" aria-hidden="true"></span>
            <span class="lamp tail" aria-hidden="true"></span>
          </span>
        </button>

        <div class="quick">
          <button class="quick-btn" id="qAdd" type="button"><span class="ring-btn"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3.5A1.5 1.5 0 0 1 5.5 2h8A1.5 1.5 0 0 1 15 3.5V20h.5a1 1 0 1 1 0 2h-12a1 1 0 1 1 0-2H4zM6.5 4.5v5h6v-5zM16.3 5.3a1 1 0 0 1 1.4 0l2.7 2.7c.4.4.6.9.6 1.4V17a2.5 2.5 0 0 1-5 0v-3.5h1.5V17a1 1 0 0 0 2 0v-5.5h-.6A1.6 1.6 0 0 1 17.3 10V8.4l-1-1a1 1 0 0 1 0-1.4z"/></svg></span><span data-i18n="q.add"></span></button>
          <button class="quick-btn" id="qPrice" type="button"><span class="ring-btn"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 4a1 1 0 0 1 1-1h7.2a2 2 0 0 1 1.4.6l8.2 8.2a2 2 0 0 1 0 2.8l-6.8 6.8a2 2 0 0 1-2.8 0L3.6 13.2A2 2 0 0 1 3 11.8zM7.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg></span><span data-i18n="q.price"></span></button>
          <button class="quick-btn" id="qSync" type="button"><span class="ring-btn"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 4a8 8 0 0 1 7.4 5H17a1 1 0 0 0 0 2h4.5a1 1 0 0 0 1-1V5.5a1 1 0 1 0-2 0v1.7A10 10 0 0 0 2.1 10.9a1 1 0 0 0 2 .3A8 8 0 0 1 12 4zM21 12.8a1 1 0 0 0-1.1.9A8 8 0 0 1 4.6 15H7a1 1 0 1 0 0-2H2.5a1 1 0 0 0-1 1v4.5a1 1 0 1 0 2 0v-1.7a10 10 0 0 0 18.4-3.7 1 1 0 0 0-.9-1.3z"/></svg></span><span data-i18n="q.sync"></span></button>
        </div>

        <div id="banner" class="banner" hidden></div>
        <div id="alerts" class="alerts"></div>

        <nav class="menu">
          <button class="menu-row" data-open="economy">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 4a10 10 0 0 0-8.7 15.1 1 1 0 0 0 .9.4h15.6a1 1 0 0 0 .9-.4A10 10 0 0 0 12 4zM12 17.2a1.8 1.8 0 0 1-.9-3.4l5.2-5.3.8.8-4.6 5.9a1.8 1.8 0 0 1-.5 2z"/></svg>
            <span class="menu-text"><b data-i18n="chart.rate"></b><small id="mEconomy"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="historyPage">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM11 6h2v5.5l3.6 2.1-1 1.7L11 12.6z"/></svg>
            <span class="menu-text"><b data-i18n="history"></b><small id="mHistory"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="monthly">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 13a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7H4zM10 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v16h-4zM16 9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v11h-4zM2 20.2h20V22H2z"/></svg>
            <span class="menu-text"><b data-i18n="m.chart"></b><small id="mMonthly"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="care">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M21.7 6.3a1 1 0 0 0-1.6-.3l-2.7 2.7-2.1-.5-.5-2.1 2.7-2.7a1 1 0 0 0-.3-1.6 6 6 0 0 0-7.9 7.6L2.6 16.1a2.5 2.5 0 0 0 3.5 3.5l6.7-6.7a6 6 0 0 0 7.6-7.9z"/></svg>
            <span class="menu-text"><b data-i18n="page.care"></b><small id="mCare"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="yearPage">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM6 11v3h3v-3zM10.5 11v3h3v-3zM15 11v3h3v-3zM6 15.5v3h3v-3zM10.5 15.5v3h3v-3z"/></svg>
            <span class="menu-text"><b data-i18n="page.year"></b><small id="mYear"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="loan">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 7a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1H2zM2 10.5h20V17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3zM5.5 15v2h5v-2z"/></svg>
            <span class="menu-text"><b data-i18n="page.loan"></b><small id="mLoan"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="menu-row" data-open="settings">
            <svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.90 12.00 L22.15 12.96 L21.75 15.00 L19.30 15.02 L18.57 16.39 L17.59 17.59 L18.50 19.86 L16.77 21.01 L15.02 19.30 L13.54 19.75 L12.00 19.90 L11.04 22.15 L9.00 21.75 L8.98 19.30 L7.61 18.57 L6.41 17.59 L4.14 18.50 L2.99 16.77 L4.70 15.02 L4.25 13.54 L4.10 12.00 L1.85 11.04 L2.25 9.00 L4.70 8.98 L5.43 7.61 L6.41 6.41 L5.50 4.14 L7.23 2.99 L8.98 4.70 L10.46 4.25 L12.00 4.10 L12.96 1.85 L15.00 2.25 L15.02 4.70 L16.39 5.43 L17.59 6.41 L19.86 5.50 L21.01 7.23 L19.30 8.98 L19.75 10.46Z M15.2 12 a3.2 3.2 0 1 0 -6.4 0 a3.2 3.2 0 1 0 6.4 0z"/></svg>
            <span class="menu-text"><b data-i18n="settings"></b><small data-i18n="menu.settingsSub"></small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </nav>
      </div>
    </main>
  </div>

  <section id="economy" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="chart.rate"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body">
      <section class="stats">
        <div class="stat"><span class="stat-label" data-i18n="stat.avg"></span><span class="stat-value" id="statAvg">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="stat.last"></span><span class="stat-value" id="statLast">–</span><span class="stat-unit" data-i18n="unit.kml"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="stat.costKm"></span><span class="stat-value" id="statCostKm">–</span><span class="stat-unit" data-i18n="unit.bahtKm"></span></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2 data-i18n="chart.rate"></h2>
          <div class="segmented" id="rangeSeg" role="tablist">
            <button data-range="30" data-i18n="range.month"></button>
            <button data-range="365" data-i18n="range.year"></button>
            <button data-range="all" data-i18n="range.all"></button>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div id="legend" class="legend"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 data-i18n="cmp.title"></h2></div>
        <div id="typeCompare" class="compare"></div>
        <p class="hint" data-i18n="cmp.note"></p>
      </section>
    </div>
  </section>

  <section id="historyPage" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="history"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body">
      <section class="hs-card" id="historySummary"></section>
      <section>
        <ul id="history" class="fill-list"></ul>
        <div id="loadMore" class="load-more" hidden><span class="spinner"></span></div>
      </section>
    </div>
  </section>

  <section id="monthly" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="page.monthly"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body">
      <section class="stats">
        <div class="stat"><span class="stat-label" data-i18n="m.max"></span><span class="stat-value" id="mMax">–</span><span class="stat-unit" id="mMaxLabel"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="m.now"></span><span class="stat-value" id="mNow">–</span><span class="stat-unit" id="mNowLabel"></span></div>
        <div class="stat"><span class="stat-label" data-i18n="m.avg"></span><span class="stat-value" id="mAvg">–</span><span class="stat-unit" data-i18n="unit.perMonth"></span></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2 data-i18n="m.chart"></h2>
          <div class="segmented" id="mRangeSeg" role="tablist">
            <button data-range="6" data-i18n="range.6m"></button>
            <button data-range="12" data-i18n="range.year"></button>
            <button data-range="all" data-i18n="range.all"></button>
          </div>
        </div>
        <div id="mChart" class="chart"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2 data-i18n="m.list"></h2></div>
        <ul id="mList" class="history"></ul>
      </section>
    </div>
  </section>

  <section id="loan" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="page.loan"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body" id="loanBody"></div>
  </section>

  <section id="yearPage" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="page.year"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body">
      <div class="segmented wide year-seg" id="yearSeg"></div>
      <div id="yearBody"></div>
    </div>
  </section>

  <section id="care" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="page.care"></h1>
      <span class="spacer"></span>
    </header>
    <div class="page-body" id="careBody"></div>
  </section>

  <!-- ฟอร์มค่าใช้จ่ายอื่น -->
  <section id="expenseForm" class="sheet sheet-rise" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h1 data-i18n="exp.title"></h1>
      <span class="spacer"></span>
    </header>
    <form id="expForm" class="form" novalidate>
      <label class="field"><span data-i18n="form.date"></span><input type="date" name="date" required></label>
      <div class="field"><span data-i18n="exp.category"></span><div class="chips" id="catChips"></div></div>
      <label class="field"><span data-i18n="exp.amount"></span><input type="text" name="amount" inputmode="decimal" autocomplete="off" required></label>
      <label class="field"><span data-i18n="exp.mileage"></span><input type="text" name="mileage" inputmode="numeric" autocomplete="off"><small class="hint" id="expMileageHint"></small></label>
      <label class="field"><span data-i18n="exp.note"></span><input type="text" name="note" autocomplete="off"></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="expSaveBtn" disabled data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- ตั้งค่าการแจ้งเตือน -->
  <section id="careSettings" class="sheet sheet-rise" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h1 data-i18n="rem.edit"></h1>
      <span class="spacer"></span>
    </header>
    <form id="remForm" class="form" novalidate>
      <div class="field-row">
        <label class="field"><span data-i18n="rem.interval"></span><input type="text" name="serviceInterval" inputmode="numeric" autocomplete="off"></label>
        <label class="field"><span data-i18n="rem.months"></span><input type="text" name="serviceMonths" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="field-row">
        <label class="field"><span data-i18n="rem.lastService"></span><input type="text" name="lastServiceKm" inputmode="numeric" autocomplete="off"></label>
        <label class="field"><span data-i18n="rem.lastServiceDate"></span><input type="date" name="lastServiceDate"></label>
      </div>
      <small class="hint" data-i18n="rem.lastServiceHint"></small>
      <label class="field"><span data-i18n="rem.tank"></span><input type="text" name="tankL" inputmode="decimal" autocomplete="off"></label>
      <label class="field"><span data-i18n="rem.tax"></span><input type="date" name="taxDue"></label>
      <label class="field"><span data-i18n="rem.insurance"></span><input type="date" name="insuranceDue"></label>
      <label class="field"><span data-i18n="rem.act"></span><input type="date" name="actDue"></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- อัปเดตเลขไมล์ด่วน -->
  <section id="odoSheet" class="sheet sheet-bottom" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <h2 data-i18n="odo.title"></h2>
    <form id="odoForm" class="form" novalidate>
      <label class="field">
        <span data-i18n="odo.label"></span>
        <input type="text" id="odoInput" inputmode="numeric" autocomplete="off">
        <small class="hint" id="odoHint"></small>
      </label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="odoSave" disabled data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- ราคาน้ำมัน PTT วันนี้ -->
  <div class="backdrop" id="backdrop" hidden></div>
  <section id="prices" class="sheet sheet-bottom" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <h2 data-i18n="prices.title"></h2>
    <p class="hint" id="pricesDate"></p>
    <div id="pricesList" class="detail"></div>
    <div class="form-actions"><button type="button" class="btn ghost" data-close data-i18n="close"></button></div>
  </section>

  <!-- ฟอร์มเพิ่ม log -->
  <section id="form" class="sheet sheet-rise fill-sheet" hidden>
    <header class="fill-top">
      <div class="grabber" aria-hidden="true"></div>
      <div class="fill-head">
        <h1 data-i18n="form.title"></h1>
        <button class="close-x" type="button" data-close data-i18n-aria="cancel"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    </header>
    <form id="entryForm" class="fill-form" novalidate>
      <div class="type-pills" id="typeChips" role="radiogroup"></div>

      <label class="amount">
        <span class="amount-label" data-i18n="form.price"></span>
        <span class="amount-input"><span class="currency">฿</span><input type="text" name="price" inputmode="decimal" autocomplete="off" placeholder="0" required></span>
      </label>

      <div class="fill-cards">
        <label class="fill-card">
          <span class="fc-label" data-i18n="form.mileage"></span>
          <input type="text" name="mileage" inputmode="numeric" autocomplete="off" required>
          <small id="mileageHint" class="hint"></small>
        </label>
        <label class="fill-card">
          <span class="fc-label" data-i18n="form.oilPrice"></span>
          <input type="text" name="oilPrice" inputmode="decimal" autocomplete="off" required>
          <small id="priceHint" class="hint"></small>
        </label>
      </div>

      <label class="date-pill">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 9v10h14V9z"/></svg>
        <input type="date" name="date" required>
      </label>

      <div class="live" id="preview"></div>

      <button type="submit" class="save-btn" id="saveBtn" disabled data-i18n="save"></button>
    </form>
  </section>

  <!-- รายละเอียด / ลบ -->
  <section id="detail" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 data-i18n="detail.title"></h1>
      <span class="spacer"></span>
    </header>
    <div class="form">
      <div id="detailBody" class="detail"></div>
      <p class="hint" data-i18n="detail.hint"></p>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteBtn" data-i18n="detail.delete"></button>
      </div>
    </div>
  </section>

  <!-- ตั้งค่า -->
  <section id="settings" class="sheet sheet-push" hidden>
    <header class="topbar">
      <button class="icon-btn" data-close data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 data-i18n="settings"></h1>
      <span class="spacer"></span>
    </header>
    <div class="set-page">
      <section class="set-profile">
        <img src="img/car.png" alt="" class="set-car">
        <label class="set-name">
          <input type="text" id="carNameInput" maxlength="30" autocomplete="off" placeholder="Yaris ATIV" data-i18n-aria="s.carName">
          <small><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M15.2 3.6a2 2 0 0 1 2.8 0l2.4 2.4a2 2 0 0 1 0 2.8L9 20.2l-5.6 1.2a.8.8 0 0 1-1-1L3.6 15z"/></svg><span data-i18n="s.carNameHint"></span></small>
        </label>
      </section>

      <h3 class="set-title" data-i18n="s.look"></h3>
      <section class="set-group">
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#5e5ce6"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></span><b data-i18n="s.mode"></b></div>
          <div class="segmented wide" id="themeSeg">
            <button type="button" data-theme-mode="auto" data-i18n="s.mode.auto"></button>
            <button type="button" data-theme-mode="light" data-i18n="s.mode.light"></button>
            <button type="button" data-theme-mode="dark" data-i18n="s.mode.dark"></button>
          </div>
        </div>
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#ff375f"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 10.8C22 5.9 17.5 2 12 2zM6.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM9.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM14.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM17.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></span><b data-i18n="s.accent"></b></div>
          <div class="swatches" id="swatches"></div>
          <div class="wheel-picker" id="huePicker" hidden>
            <div class="hue-ring" id="hueRing">
              <div class="hue-knob" id="hueKnob"></div>
              <div class="hue-preview" id="huePreview"></div>
            </div>
            <p class="hint" data-i18n="s.hue"></p>
            <label class="field slider-field">
              <span data-i18n="s.saturation"></span>
              <input type="range" id="satRange" min="25" max="100" step="1">
            </label>
          </div>
        </div>
        <div class="set-row stack">
          <div class="set-row-head"><span class="set-ic" style="--c:#0a84ff"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg></span><b data-i18n="s.language"></b></div>
          <div class="segmented wide" id="langSeg">
            <button type="button" data-lang="th">ไทย</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
      </section>

      <h3 class="set-title" data-i18n="s.sheet"></h3>
      <section class="set-group">
        <div class="set-row" id="connCard">
          <span class="set-ic" style="--c:#30d158"><svg class="ic" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM5 8v4h6V8zM13 8v4h6V8zM5 14v5h6v-5zM13 14v5h6v-5z"/></svg></span>
          <div class="set-text">
            <b id="connTitle"></b>
            <small id="connUrl"></small>
          </div>
          <span class="conn-dot"></span>
        </div>
        <div class="set-actions" id="connActions">
          <button type="button" class="set-btn" id="editLinkBtn" data-i18n="s.editLink"></button>
          <button type="button" class="set-btn danger" id="clearSetupBtn" data-i18n="s.disconnect"></button>
        </div>
        <div class="set-row stack" id="setupEditor">
          <label class="field">
            <span data-i18n="s.setupCode"></span>
            <textarea id="setupInput" rows="4" placeholder="https://script.google.com/macros/s/…/exec?k=…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
            <small class="hint" data-i18n="s.setupHint"></small>
          </label>
          <p id="settingsStatus" class="hint"></p>
          <div class="form-actions">
            <button type="button" class="btn ghost" id="cancelEditBtn" data-i18n="cancel"></button>
            <button type="button" class="btn primary" id="saveSetupBtn" data-i18n="s.connect"></button>
          </div>
        </div>
      </section>

      <p class="set-foot">Fuel Logger · <span id="appVersion"></span></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
